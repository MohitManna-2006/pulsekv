// ClusterMetadataService — the interface clients and adapters use to discover
// cluster shape.
//
// Phase 3 status: implemented by the Go control plane in control/ and served
// from a live SWIM gossip membership snapshot. Phase 5 replaces the derived
// shard map with a Raft-backed state machine. Existing RPC methods remain
// stable; topology_generation was added compatibly for coherent multi-RPC reads.

syntax = "proto3";

package pulsekv.metadata.v1;

option go_package = "pulsekv/control/gen/metadata/v1;metadatav1";

service ClusterMetadataService {
  // Liveness of the control plane itself. Implemented for real in Phase 0.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Every node the control plane knows about.
  rpc GetNodeList(GetNodeListRequest) returns (GetNodeListResponse);

  // Shard-to-owner assignment.
  rpc GetShardMap(GetShardMapRequest) returns (GetShardMapResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ok = 1;
  int64 uptime_seconds = 2;
}

message NodeInfo {
  string node_id = 1;
  string address = 2;  // host:port where this node's NodeService listens
  bool alive = 3;
}

message GetNodeListRequest {}

message GetNodeListResponse {
  repeated NodeInfo nodes = 1;

  // Monotonically increases within one metadata publisher whenever its live
  // data-node membership changes. It is diagnostic, not a globally unique
  // revision: a restarted or different publisher can reuse the same number.
  uint64 topology_generation = 2;

  // SHA-256 over the canonical shard count, sorted (node_id, address) pairs,
  // and complete shard ownership map. Clients fetch GetNodeList and
  // GetShardMap separately and must compare this fingerprint before installing
  // the pair. Unlike the local counter above, it remains safe across publisher
  // restarts and observers with different event histories. Empty means a
  // pre-Phase-3 server.
  bytes topology_fingerprint = 3;
}

message GetShardMapRequest {}

message GetShardMapResponse {
  // Phase 3: derived from the live gossip data-node set.
  // Phase 5 replaces the source with Raft-backed authoritative metadata.
  map<uint32, string> shard_to_node_id = 1;

  // The membership generation used to compute shard_to_node_id. See
  // GetNodeListResponse.topology_generation.
  uint64 topology_generation = 2;

  // Content identity for this complete topology. See
  // GetNodeListResponse.topology_fingerprint.
  bytes topology_fingerprint = 3;

  // Fixed logical shard count. This is explicit so an authoritative topology
  // with zero live nodes can carry an empty owner map without losing the
  // cluster shape; clients install that state and fail routing locally instead
  // of retaining stale owners.
  uint32 shard_count = 4;
}
