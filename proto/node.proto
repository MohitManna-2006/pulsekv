// NodeService — the interface a control-plane instance uses to talk to one
// data-plane node.
//
// Phase 1 status: every RPC here is implemented by the C++ shim in
// node/grpc_shim/ over the pure-C engine in node/engine/. Nothing returns
// UNIMPLEMENTED any more.
//
// This contract is frozen as of Phase 0. Phases 1-8 are written against this
// shape; add fields and RPCs rather than renaming or removing them. Phase 1
// added PutChunked/GetChunked and their messages; Phase 4 added the three
// replication fields below. Nothing existing changed in either phase.
//
// ERROR CHANNEL: gRPC status codes are the sole error channel for every RPC
// here. A handler either returns OK with a valid response, or a non-OK status
// — never OK with an in-band error string. gRPC discards the response message
// when the status is non-OK, so an in-band error field would be unreadable
// anyway. See PutResponse.error for the one field this leaves unused.

syntax = "proto3";

package pulsekv.node.v1;

option go_package = "pulsekv/control/gen/node/v1;nodev1";

service NodeService {
  // Liveness plus node identity.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Point lookup, for values up to UNARY_VALUE_LIMIT_BYTES. A miss is a
  // successful response with found = false, not an error.
  //
  // If the stored value exceeds the unary limit the call fails with
  // FAILED_PRECONDITION pointing at GetChunked; use GetChunked when the size
  // is unknown.
  rpc Get(GetRequest) returns (GetResponse);

  // Point write, for values up to UNARY_VALUE_LIMIT_BYTES. A larger value
  // fails fast with INVALID_ARGUMENT pointing at PutChunked rather than being
  // silently accepted.
  //
  // Phase 4: a node that is the current primary for the key's shard also
  // forwards the write to that shard's replicas. See PutRequest for the two
  // modes and the loop-prevention rule.
  rpc Put(PutRequest) returns (PutResponse);

  // Chunked write for values above the unary limit. Chunks must arrive in
  // strictly ascending chunk_index order starting at 0 — gRPC already
  // guarantees stream ordering, so a gap or a repeat means a buggy client and
  // is rejected rather than reassembled. See PutChunk.
  rpc PutChunked(stream PutChunk) returns (PutResponse);

  // Chunked read. Always valid regardless of value size; a small value simply
  // arrives as a single chunk. A miss is an empty stream (zero messages,
  // status OK), not an error — mirroring Get's found = false.
  rpc GetChunked(GetRequest) returns (stream GetChunk);

  // Streaming so a prefix scan can return more than fits in one message —
  // KV-cache blocks are megabytes each.
  rpc PrefixMatch(PrefixMatchRequest) returns (stream PrefixMatchResponse);

  // Per-tier occupancy, used by the control plane for placement decisions.
  rpc Capacity(CapacityRequest) returns (CapacityResponse);
}

// The value size above which the unary Get/Put path is refused and the chunked
// path is required. Matches gRPC's own 4 MiB default max message size, which is
// a reasonable line between "fits comfortably in one message" and "needs
// streaming". Declared here so clients do not have to hardcode it.
//
// This is a WIRE limit. The engine's own hard ceiling on a stored value is a
// separate, larger, per-node configuration value (--max-value-bytes, default
// 64 MiB); exceeding that fails with OUT_OF_RANGE on either path.
enum UnaryLimit {
  UNARY_LIMIT_UNSPECIFIED = 0;
  UNARY_VALUE_LIMIT_BYTES = 4194304;  // 4 MiB
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ok = 1;
  string node_id = 2;
  int64 uptime_seconds = 3;
}

message GetRequest { bytes key = 1; }

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;

  // Set by a primary forwarding this write to one of its replicas; NEVER set
  // by a client. A node that receives it stores the value and returns, without
  // forwarding anything itself — that single rule is the whole of the
  // replication loop prevention.
  //
  // This is a cooperation flag, not an authorisation one: a client that sets it
  // suppresses its own write's replication. Authenticated peer identity is a
  // production-hardening concern, not a Phase 4 one.
  bool from_replication = 3;

  // 0 (the default) means the primary commits locally, answers immediately, and
  // replicates in the background — cache writes should not pay replication
  // latency. N > 0 means the primary answers only after N replicas have acked,
  // for callers who would rather pay that latency than lose the write.
  //
  // N greater than the primary's current live replica count is INVALID_ARGUMENT
  // rather than a call that hangs until its deadline. On a timeout or an ack
  // shortfall the call fails with DEADLINE_EXCEEDED — but note the local write
  // already happened and is NOT rolled back, so that error means "your write is
  // less replicated than you asked for", not "your write was lost".
  uint32 require_replica_acks = 4;
}

message PutResponse {
  // Always true when the status is OK. A write that failed returns a non-OK
  // gRPC status instead — see the ERROR CHANNEL note at the top of this file.
  bool ok = 1;

  // Still unused, and deliberately kept rather than removed: the contract is
  // frozen. Phase 4 reported its partial-success information in the dedicated
  // replicas_acked field below instead, because a machine-readable count is
  // what a caller can actually act on.
  string error = 2;

  // How many replicas acked before this response was sent. Always 0 for a
  // require_replica_acks = 0 write: nothing was waited for, so nothing is
  // claimed. Exactly require_replica_acks (or more) for an OK response to a
  // strong-ack write.
  uint32 replicas_acked = 3;
}

// One frame of a PutChunked stream.
//
// Conventions, all enforced by the server:
//   * key          — required on chunk 0. On later chunks it may be empty
//                    (preferred, saves bytes) or byte-identical; a different
//                    non-empty key aborts the stream.
//   * chunk_index  — must start at 0 and increase by exactly 1 per message.
//   * total_chunks — required on chunk 0, must be > 0, and must be repeated
//                    identically or left 0 on later chunks. The stream must
//                    contain exactly this many messages.
//   * total_length — required on chunk 0. Checked against the node's
//                    --max-value-bytes BEFORE a single byte is buffered, so a
//                    corrupt or hostile length cannot force a large
//                    allocation. The concatenated data must be exactly this
//                    long; a lie in either direction aborts the stream.
//   * data         — may be empty only for a zero-length value (one chunk,
//                    total_length = 0).
//   * from_replication — chunk 0 only; ignored on later chunks.
message PutChunk {
  bytes key = 1;
  uint32 chunk_index = 2;
  uint32 total_chunks = 3;
  uint64 total_length = 4;
  bytes data = 5;

  // Same meaning as PutRequest.from_replication, read from chunk 0 only.
  //
  // There is deliberately no require_replica_acks counterpart: a chunked write
  // is by definition a multi-megabyte value, where the async path is the only
  // one that makes sense. PutChunked therefore always replicates in the
  // background, and the Go SDK's PutWithAck refuses an oversized value loudly
  // rather than silently downgrading it to fire-and-forget.
  bool from_replication = 6;
}

// One frame of a GetChunked stream. total_chunks and total_length are repeated
// on every chunk so a client can size its buffer from the first message and
// verify completeness without tracking state across the whole stream.
message GetChunk {
  uint32 chunk_index = 1;
  uint32 total_chunks = 2;
  uint64 total_length = 3;
  bytes data = 4;
}

message PrefixMatchRequest { bytes prefix = 1; }

message PrefixMatchResponse {
  bytes key = 1;
  bytes value = 2;

  // Set when this key matched but its value is larger than
  // UNARY_VALUE_LIMIT_BYTES, so it was not inlined: `value` is empty and the
  // caller should fetch it with GetChunked.
  //
  // Added in Phase 1. Without it, a scan over a cache of multi-megabyte KV
  // blocks has only bad options — fail the whole stream on the first large
  // value, or return an empty `value` that is indistinguishable from a key
  // whose stored value genuinely is empty. This makes the distinction explicit
  // instead.
  bool value_omitted = 3;
}

message CapacityRequest {}

message CapacityResponse {
  // Every key this node can serve, across both tiers. A spilled key keeps its
  // index entry in RAM — only its value moves to NVMe — so it is still
  // "resident" in the sense that matters to the control plane: this node
  // answers for it.
  uint64 resident_keys = 1;

  // Value bytes held in RAM, and value bytes spilled to NVMe. These are value
  // bytes only; the in-RAM index (keys plus per-entry bookkeeping) is not
  // counted, and neither is spill-file header overhead. Documented rather than
  // silently approximated — see docs/pulsekv-v2-phase1-summary.md.
  uint64 bytes_in_ram_tier = 2;
  uint64 bytes_in_nvme_tier = 3;
}
