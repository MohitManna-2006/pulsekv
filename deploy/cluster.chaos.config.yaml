# Eight-node local fixture for Phase 3 membership/elasticity and Phase 4
# replication/promotion chaos runs. It uses the same service and gossip ranges
# as the four-node fast-loop config, extended contiguously. Run only one fixture
# at a time.
#
# replication_factor here is the default the fixture ships with; the chaos runs
# override it per boot with run-local-cluster.sh --replication-factor, which is
# how the same fixture is exercised at 0, 1, and 2 without three config files.

# Three control-plane replicas: the Raft metadata group the leader-failover
# chaos scenario kills a member of.
control_plane:
  - {node_id: cp-0, host: 127.0.0.1, port: 7000}
  - {node_id: cp-1, host: 127.0.0.1, port: 7001}
  - {node_id: cp-2, host: 127.0.0.1, port: 7002}

raft:
  data_dir: run/raft
  election_timeout_ms: 500
  propose_interval_ms: 200

membership:
  cluster_name: pulsekv-v2-chaos

shard_count: 256

replication_factor: 1

engine:
  ram_budget_bytes: 268435456
  max_value_bytes: 67108864
  data_root: run/data

nodes:
  - {node_id: node-0, host: 127.0.0.1, port: 7100, gossip_port: 7201}
  - {node_id: node-1, host: 127.0.0.1, port: 7101, gossip_port: 7202}
  - {node_id: node-2, host: 127.0.0.1, port: 7102, gossip_port: 7203}
  - {node_id: node-3, host: 127.0.0.1, port: 7103, gossip_port: 7204}
  - {node_id: node-4, host: 127.0.0.1, port: 7104, gossip_port: 7205}
  - {node_id: node-5, host: 127.0.0.1, port: 7105, gossip_port: 7206}
  - {node_id: node-6, host: 127.0.0.1, port: 7106, gossip_port: 7207}
  - {node_id: node-7, host: 127.0.0.1, port: 7107, gossip_port: 7208}
