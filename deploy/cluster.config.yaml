# PulseKV v2 -- launch/bootstrap inventory for the local dev cluster.
#
# This file is the single source of truth for the dev cluster's shape. It is
# read by:
#   * the Go control plane, which uses it for its fixed shard count and gossip
#     bootstrap endpoints; live membership itself comes from SWIM
#   * deploy/run-local-cluster.sh and deploy/stop-local-cluster.sh, which get
#     the node list by shelling out to `controlplane --print-nodes` rather than
#     parsing YAML themselves
#   * deploy/smoke-test.sh, which asserts the cluster matches what is here
#
# ---------------------------------------------------------------------------
# Scaling the node count
# ---------------------------------------------------------------------------
# The default is 4 nodes: enough to prove routing and multi-process boot, small
# enough for a fast edit-run-check loop.
#
# The design target for gossip/chaos and later Raft testing (Phases 3 and 5) is
# 8-32 simulated nodes on one machine -- that range is what makes gossip
# convergence, rendezvous-hash key movement, and Raft leader election
# meaningful to measure without real multi-host infrastructure. Adding entries
# to `nodes:` below is the ONLY change needed to get there; no script takes the
# node count as an argument or hardcodes it anywhere.
#
# To scale up, keep node_id unique and both port ranges contiguous:
#
#   nodes:
#     - {node_id: node-0, port: 7100, gossip_port: 7201}
#     ...
#     - {node_id: node-31, port: 7131, gossip_port: 7232}
#
# Port 7100 + N keeps 32 nodes inside 7100-7131, clear of the control plane.
# The config loader rejects duplicate node IDs and duplicate host:port pairs
# outright, so a copy-paste slip fails at startup rather than producing a
# cluster where two nodes quietly fight over one port.
#
# ---------------------------------------------------------------------------
# Authority boundaries
# ---------------------------------------------------------------------------
# The nodes here are processes the local launcher should create and addresses
# participants may use to bootstrap. They are not the runtime node list: a
# sidecar must join the gossip ring before ClusterMetadataService publishes it,
# and a terminal leave/death removes it without changing this file.
#
# Phase 4 added replication_factor below. There is still no explicit shard
# assignment here: Phase 5's Raft state machine replaces this file as the source
# of the shard map. The ClusterMetadataService methods remain stable; a
# content-derived topology fingerprint prevents clients from combining epochs
# across its two calls.

control_plane:
  # host is optional and defaults to 127.0.0.1.
  port: 7000
  # memberlist uses this port for both TCP state exchange and UDP probes.
  gossip_port: 7200

# The label carried by every memberlist packet. Participants with a different
# label cannot accidentally merge into this ring. The local demo binds every
# endpoint to loopback; authenticated/encrypted gossip is production hardening,
# not part of the Phase 3 local-cluster claim.
membership:
  cluster_name: pulsekv-v2

# Number of logical cluster shards. These are the unit of ownership and, from
# Phase 3 on, the unit of rebalancing.
#
# Phase 3 assigns them with deterministic rendezvous (HRW) hashing over the
# live gossip snapshot. That gives the minimal-key-movement property the design
# requires while nodes join, leave, fail, and recover.
#
# 256 gives a 4-node cluster 64 shards each and a 32-node cluster 8 each, which
# is fine-grained enough for Phase 3 to have something real to move around.
# Unrelated to v1's 256 intra-process hashtable shards, which exist for lock
# striping inside one process.
shard_count: 256

# ---------------------------------------------------------------------------
# Replication (Phase 4)
# ---------------------------------------------------------------------------
# Replicas per shard BEYOND the primary. The design doc's range is 0, 1, or 2.
#
#   0  no replication at all; a node's data dies with it, exactly as in Phase 3
#   1  one extra copy; survives one node loss (the default)
#   2  two extra copies; survives two
#
# The control plane derives the replica set from the same rendezvous ranking
# that picks the primary -- ranks 2..N of the same argmax -- so when a primary
# dies, every participant independently derives the same successor with nothing
# to coordinate. shard_to_node_id stays exactly the primary, so this setting is
# invisible to anything that only routes reads and writes.
#
# Nodes learn their replica peers by polling ClusterMetadataService; that is what
# run-local-cluster.sh's --metadata-addr wiring is for. A node started without
# it does not replicate, whatever this says.
#
# 0 IS A LEGAL, EXERCISED SETTING, and it is distinct from omitting the key
# (which defaults to 1). deploy/chaos-test.sh is run at 0 as well as at 1 and 2.
replication_factor: 1

# ---------------------------------------------------------------------------
# Data-plane engine settings (Phase 1)
# ---------------------------------------------------------------------------
# Applied identically to every node; run-local-cluster.sh passes them through as
# --ram-budget-bytes / --max-value-bytes / --data-dir. Raw byte counts, not
# "256MiB" strings, so the Go loader and the C++ node cannot disagree about what
# a suffix means.
engine:
  # RAM tier budget per node. IMPORTANT: this is divided evenly across the
  # engine's 256 lock shards, so each shard gets ram_budget_bytes / 256 -- here,
  # 1 MiB. A global counter would be one contended cache line on every write,
  # which is the bottleneck the 256-way striping exists to avoid; the price is
  # that occupancy is only as even as the hash, and a shard holding a single
  # entry never evicts it. Total resident bytes can therefore exceed this
  # figure. See docs/pulsekv-v2-phase1-summary.md.
  ram_budget_bytes: 268435456   # 256 MiB

  # Hard ceiling on one stored value, enforced before anything is allocated for
  # it. Values above 4 MiB (the unary wire limit, fixed in proto/node.proto)
  # must use PutChunked/GetChunked.
  max_value_bytes: 67108864     # 64 MiB

  # Root for per-node NVMe spill directories, relative to deploy/. Each node
  # gets its own <data_root>/<node_id>; nodes must never share one. The engine
  # creates and exclusively owns <dir>/spill/ and PURGES IT at startup and
  # shutdown -- the tier is a spill tier, not persistence, and nothing in it
  # survives a restart.
  data_root: run/data

nodes:
  - node_id: node-0
    port: 7100
    gossip_port: 7201
  - node_id: node-1
    port: 7101
    gossip_port: 7202
  - node_id: node-2
    port: 7102
    gossip_port: 7203
  - node_id: node-3
    port: 7103
    gossip_port: 7204
